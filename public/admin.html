<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Herd Tracker — Owner</title>
<style>body{font:16px system-ui;max-width:420px;margin:40px auto;padding:0 16px;background:#000;color:#f3efe4}
input,button{width:100%;box-sizing:border-box;font:inherit;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #444;background:#141414;color:#f3efe4}
button{background:#f5b942;color:#000;font-weight:700;border:0}pre{white-space:pre-wrap;background:#141414;padding:12px;border-radius:10px}</style>
</head><body>
<h2>New producer</h2>
<input id=secret type=password placeholder="Admin secret">
<input id=name placeholder="Producer / business name">
<input id=email type=email placeholder="Producer's email">
<button onclick="go()">Create account</button>
<pre id=out></pre>
<script>
async function go(){
 const r=await fetch('/.netlify/functions/create-producer',{method:'POST',headers:{'content-type':'application/json'},
  body:JSON.stringify({secret:secret.value,name:name.value,email:email.value})});
 const d=await r.json();
 out.textContent=r.ok?('Created. Producer code to email them:\n\n'+d.producer.code):('Error: '+d.error);
}
</script></body></html>
